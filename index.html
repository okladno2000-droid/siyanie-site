<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сияние — Чат</title>
<style>
  :root {
    --bg: #0f0f0f;
    --sidebar: #212121;
    --sidebar-hover: #2b2b2b;
    --border: #181818;
    --bubble-own: #8774e1;
    --bubble-other: #212121;
    --text: #ffffff;
    --text-muted: #aaaaaa;
    --text-secondary: #777777;
    --accent: #8774e1;
    --accent-light: #a497f0;
    --danger: #ff6b81;
    --success: #4ade80;
    --input-bg: #2b2b2b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

  /* ===== AUTH SCREEN ===== */
  #auth-screen {
    display: flex; align-items: center; justify-content: center;
    height: 100vh; background: var(--bg);
  }
  .auth-box {
    width: 380px; background: var(--sidebar);
    border: 1px solid var(--border); border-radius: 16px;
    padding: 32px;
  }
  .auth-logo {
    text-align: center; margin-bottom: 24px;
    font-size: 28px; font-weight: 800;
    background: linear-gradient(120deg, var(--accent), #4fd8ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .auth-tabs {
    display: flex; gap: 4px; background: var(--bg);
    border-radius: 10px; padding: 4px; margin-bottom: 20px;
  }
  .auth-tab {
    flex: 1; text-align: center; padding: 10px; border-radius: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer; border: none;
    background: transparent; color: var(--text-muted); font-family: inherit;
  }
  .auth-tab.active {
    background: linear-gradient(120deg, var(--accent), #4fd8ff); color: #07060c;
  }
  .auth-view { display: none; }
  .auth-view.active { display: block; }
  label { display: block; font-size: 12.5px; color: var(--text-muted); margin: 0 0 6px; }
  input[type="email"], input[type="password"], input[type="text"] {
    width: 100%; font-family: inherit; font-size: 15px; color: var(--text);
    background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; outline: none; margin-bottom: 14px;
  }
  input:focus { border-color: var(--accent); }
  .submit-btn {
    width: 100%; font-family: inherit; font-size: 15px; font-weight: 700;
    padding: 13px; border-radius: 10px; border: none; cursor: pointer;
    background: linear-gradient(120deg, var(--accent), #4fd8ff); color: #07060c;
  }
  .submit-btn:disabled { opacity: 0.5; }
  .status-msg {
    font-size: 13.5px; padding: 10px 12px; border-radius: 8px;
    margin: -4px 0 14px; display: none;
  }
  .status-msg.show { display: block; }
  .status-msg.err { background: rgba(255,107,129,0.12); color: var(--danger); border: 1px solid rgba(255,107,129,0.3); }
  .status-msg.ok { background: rgba(74,222,128,0.12); color: var(--success); border: 1px solid rgba(74,222,128,0.3); }
  .verify-box { border-top: 1px dashed var(--border); margin-top: 16px; padding-top: 16px; display: none; }
  .verify-box p { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }
  .logout-btn {
    margin-top: 14px; width: 100%; padding: 11px; border-radius: 10px;
    font-family: inherit; font-size: 13.5px; font-weight: 700;
    background: transparent; border: 1px solid var(--border); color: var(--text-muted); cursor: pointer;
  }
  .user-info { text-align: center; margin-bottom: 16px; }
  .user-info .name { font-size: 18px; font-weight: 700; }
  .user-info .username { font-size: 14px; color: var(--accent-light); margin-top: 2px; }
  .user-info .email { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

  /* ===== APP SCREEN ===== */
  #app-screen { display: none; height: 100vh; }
  .app-layout { display: flex; height: 100%; }

  /* Sidebar */
  .sidebar {
    width: 380px; min-width: 380px; background: var(--sidebar);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
  }
  .sidebar-header {
    padding: 10px 14px; background: var(--sidebar); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .sidebar-search {
    flex: 1; background: var(--input-bg); border: none; border-radius: 20px;
    padding: 9px 16px; color: var(--text); font-size: 14px; outline: none; font-family: inherit;
  }
  .sidebar-search::placeholder { color: var(--text-secondary); }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%; background: transparent;
    border: none; color: var(--text-muted); cursor: pointer; font-size: 20px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--sidebar-hover); color: var(--text); }
  .new-chat-row {
    display: flex; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border);
  }
  .new-chat-row input {
    flex: 1; margin: 0; font-size: 14px; padding: 10px 12px;
  }
  .chat-list { flex: 1; overflow-y: auto; }
  .chat-item {
    display: flex; align-items: center; padding: 10px 16px; cursor: pointer;
    gap: 12px; transition: background 0.15s; position: relative;
  }
  .chat-item:hover, .chat-item.active { background: var(--sidebar-hover); }
  .chat-avatar {
    width: 50px; height: 50px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), #4fd8ff);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; color: #fff;
  }
  .chat-info { flex: 1; min-width: 0; }
  .chat-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .chat-name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-time { font-size: 12px; color: var(--text-secondary); flex-shrink: 0; }
  .chat-bottom { display: flex; justify-content: space-between; align-items: center; }
  .chat-preview { font-size: 14px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .chat-badge {
    background: var(--accent); color: #fff; font-size: 12px; font-weight: 600;
    padding: 2px 7px; border-radius: 10px; margin-left: 8px; flex-shrink: 0;
  }

  /* Chat Area */
  .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
  .chat-header {
    padding: 10px 20px; background: var(--sidebar); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px;
  }
  .chat-header-avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #4fd8ff);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700; color: #fff; flex-shrink: 0;
  }
  .chat-header-info { flex: 1; }
  .chat-header-name { font-weight: 600; font-size: 16px; }
  .chat-header-status { font-size: 13px; color: var(--accent-light); }
  .header-btn {
    width: 40px; height: 40px; border-radius: 50%; background: transparent;
    border: none; color: var(--text-muted); cursor: pointer; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
  }
  .header-btn:hover { background: var(--sidebar-hover); }

  .messages {
    flex: 1; overflow-y: auto; padding: 16px 18%;
    display: flex; flex-direction: column; gap: 2px;
  }
  .date-divider {
    text-align: center; margin: 16px 0; position: sticky; top: 0; z-index: 5;
  }
  .date-divider span {
    background: rgba(33,33,33,0.9); backdrop-filter: blur(4px);
    color: var(--text-secondary); font-size: 12px; padding: 4px 12px; border-radius: 12px;
  }
  .message-group {
    display: flex; flex-direction: column; gap: 2px;
    max-width: 68%; animation: msgIn 0.2s ease;
  }
  @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .message-group.own { align-self: flex-end; }
  .message-group.other { align-self: flex-start; }
  .message-bubble {
    padding: 8px 12px; font-size: 14.5px; line-height: 1.45;
    position: relative; word-wrap: break-word;
  }
  .message-group.own .message-bubble {
    background: var(--bubble-own); color: #fff;
    border-radius: 16px 16px 4px 16px;
  }
  .message-group.other .message-bubble {
    background: var(--bubble-other); color: var(--text);
    border-radius: 16px 16px 16px 4px;
  }
  .message-group.own .message-bubble:first-child { border-top-right-radius: 16px; }
  .message-group.own .message-bubble:last-child { border-bottom-right-radius: 4px; }
  .message-group.own .message-bubble:only-child { border-radius: 16px 16px 4px 16px; }
  .message-group.other .message-bubble:first-child { border-top-left-radius: 16px; }
  .message-group.other .message-bubble:last-child { border-bottom-left-radius: 4px; }
  .message-group.other .message-bubble:only-child { border-radius: 16px 16px 16px 4px; }
  .message-bubble:not(:first-child) { margin-top: 1px; }

  .message-meta {
    display: flex; align-items: center; justify-content: flex-end;
    gap: 4px; margin-top: 3px; font-size: 11px;
  }
  .message-group.own .message-meta { color: rgba(255,255,255,0.7); }
  .message-group.other .message-meta { color: var(--text-secondary); }
  .checkmarks { font-size: 13px; letter-spacing: -2px; }

  .input-area {
    padding: 10px 18%; background: var(--sidebar); border-top: 1px solid var(--border);
    display: flex; align-items: flex-end; gap: 10px;
  }
  .input-btn {
    width: 44px; height: 44px; border-radius: 50%; background: transparent;
    border: none; color: var(--text-muted); cursor: pointer; font-size: 20px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .input-btn:hover { background: var(--sidebar-hover); color: var(--text); }
  .message-input {
    flex: 1; background: var(--input-bg); border: none; border-radius: 20px;
    padding: 10px 16px; color: var(--text); font-size: 15px; outline: none;
    resize: none; max-height: 120px; min-height: 44px; font-family: inherit;
  }
  .message-input::placeholder { color: var(--text-secondary); }

  .empty-chat {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: var(--text-secondary);
  }
  .empty-chat-icon { font-size: 72px; margin-bottom: 16px; opacity: 0.25; }
  .empty-chat-text { font-size: 15px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #555; }

  /* Responsive */
  @media (max-width: 960px) {
    .sidebar { width: 80px; min-width: 80px; }
    .chat-info, .chat-time, .chat-bottom, .sidebar-search, .new-chat-row { display: none; }
    .chat-avatar { width: 48px; height: 48px; }
    .messages, .input-area { padding: 12px; }
  }
  @media (max-width: 600px) {
    .sidebar { display: none; }
    .messages, .input-area { padding: 10px; }
  }
</style>
</head>
<body>

<!-- ===== AUTH SCREEN ===== -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">✦ СИЯНИЕ</div>
    <div id="dashboard" style="display:none;">
      <div class="user-info">
        <div class="name" id="db-name">—</div>
        <div class="username" id="db-username">—</div>
        <div class="email" id="db-email">—</div>
      </div>
      <button class="logout-btn" id="logout-btn">Выйти</button>
    </div>
    <div id="auth-forms">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="register">Регистрация</button>
        <button class="auth-tab" data-tab="login">Вход</button>
      </div>
      <div class="auth-view active" id="view-register">
        <div class="status-msg" id="register-status"></div>
        <label>Ваше имя</label>
        <input id="reg-name" type="text" placeholder="Иван Петров" autocomplete="off">
        <label>Ник</label>
        <input id="reg-username" type="text" placeholder="ivan_petrov" autocomplete="off">
        <label>Email</label>
        <input id="reg-email" type="email" placeholder="name@example.com" autocomplete="off">
        <label>Пароль</label>
        <input id="reg-password" type="password" placeholder="Минимум 6 символов" autocomplete="off">
        <button class="submit-btn" id="register-btn">Создать аккаунт</button>
        <div class="verify-box" id="verify-box">
          <p>На ваш email отправлен код подтверждения. Введите его ниже:</p>
          <label>Код</label>
          <input id="verify-code" type="text" maxlength="6" placeholder="123456">
          <button class="submit-btn" id="verify-btn">Подтвердить</button>
          <div class="status-msg" id="verify-status"></div>
        </div>
      </div>
      <div class="auth-view" id="view-login">
        <div class="status-msg" id="login-status"></div>
        <label>Email</label>
        <input id="login-email" type="email" placeholder="name@example.com" autocomplete="off">
        <label>Пароль</label>
        <input id="login-password" type="password" placeholder="Ваш пароль" autocomplete="off">
        <button class="submit-btn" id="login-btn">Войти</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== APP SCREEN ===== -->
<div id="app-screen">
  <div class="app-layout">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <button class="icon-btn" id="menuBtn" title="Меню">☰</button>
        <input type="text" class="sidebar-search" id="searchInput" placeholder="Поиск по чатам">
        <button class="icon-btn" id="newChatToggle" title="Новый чат">+</button>
      </div>
      <div class="new-chat-row" id="newChatRow" style="display:none;">
        <input id="newChatEmail" type="text" placeholder="Email или @ник собеседника">
        <button class="submit-btn" id="startChatBtn" style="width:auto;padding:10px 16px;">→</button>
      </div>
      <div class="chat-list" id="chatList"></div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area">
      <div class="chat-header" id="chatHeader" style="display:none;">
        <div class="chat-header-avatar" id="headerAvatar">?</div>
        <div class="chat-header-info">
          <div class="chat-header-name" id="headerName">—</div>
          <div class="chat-header-status" id="headerStatus">—</div>
        </div>
        <div style="flex:1"></div>
        <button class="header-btn" id="searchChatBtn" title="Поиск по чату">🔍</button>
        <button class="header-btn" id="moreBtn" title="Ещё">⋮</button>
      </div>

      <div class="messages" id="messagesArea">
        <div class="empty-chat">
          <div class="empty-chat-icon">💬</div>
          <div class="empty-chat-text">Выберите чат, чтобы начать общение</div>
        </div>
      </div>

      <div class="input-area" id="inputArea" style="display:none;">
        <button class="input-btn" id="emojiBtn" title="Эмодзи">😊</button>
        <button class="input-btn" id="attachBtn" title="Прикрепить файл">📎</button>
        <textarea class="message-input" id="msgInput" placeholder="Написать сообщение..." rows="1"></textarea>
        <button class="input-btn" id="sendBtn" title="Отправить">➤</button>
      </div>
    </div>
  </div>
</div>

<script>
  const API_BASE = "https://calm-blessing-production-5141.up.railway.app";
  let currentToken = localStorage.getItem('siyanie_token') || null;
  let currentUser = null;
  let currentChatId = null;
  let chatsCache = [];
  let pollInterval = null;

  const $ = id => document.getElementById(id);

  function showStatus(id, ok, text) {
    const el = $(id);
    el.className = 'status-msg show ' + (ok ? 'ok' : 'err');
    el.textContent = text;
  }

  async function apiCall(path, body, token) {
    const opts = { method: body ? 'POST' : 'GET', headers: {} };
    if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    if (token || currentToken) opts.headers['Authorization'] = 'Bearer ' + (token || currentToken);
    const res = await fetch(API_BASE + path, opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || data.message || 'Ошибка ' + res.status);
    return data;
  }

  // ===== UTILS =====
  function getDisplayName(userOrChat) {
    if (!userOrChat) return 'Неизвестно';
    if (userOrChat.display_name) return userOrChat.display_name;
    if (userOrChat.name) return userOrChat.name;
    if (userOrChat.username) return '@' + userOrChat.username;
    if (userOrChat.participant_email) {
      const p = userOrChat.participant;
      if (p) return getDisplayName(p);
      return userOrChat.participant_email.split('@')[0];
    }
    if (userOrChat.email) return userOrChat.email.split('@')[0];
    return 'Пользователь';
  }

  function getUsername(userOrChat) {
    if (!userOrChat) return '';
    if (userOrChat.username) return '@' + userOrChat.username;
    if (userOrChat.participant && userOrChat.participant.username) return '@' + userOrChat.participant.username;
    return '';
  }

  function getInitials(name) {
    if (!name) return '?';
    return name.split(/[\s_@]+/).filter(Boolean).map(w => w[0].toUpperCase()).slice(0,2).join('');
  }

  // ===== AUTH =====
  async function register() {
    const display_name = $('reg-name').value.trim();
    const username = $('reg-username').value.trim().replace(/^@/, '');
    const email = $('reg-email').value.trim();
    const password = $('reg-password').value;
    if (!display_name) { showStatus('register-status', false, 'Введите ваше имя'); return; }
    if (!username) { showStatus('register-status', false, 'Придумайте ник'); return; }
    if (!email || password.length < 6) { showStatus('register-status', false, 'Введите email и пароль (мин. 6 символов)'); return; }
    $('register-btn').disabled = true;
    try {
      await apiCall('/register', { email, password, display_name, username });
      showStatus('register-status', true, 'Код отправлен на email');
      $('verify-box').style.display = 'block';
    } catch (e) { showStatus('register-status', false, e.message); }
    $('register-btn').disabled = false;
  }

  async function verify() {
    const email = $('reg-email').value.trim();
    const code = $('verify-code').value.trim();
    if (!code) { showStatus('verify-status', false, 'Введите код'); return; }
    $('verify-btn').disabled = true;
    try {
      const data = await apiCall('/verify', { email, code });
      currentToken = data.token;
      localStorage.setItem('siyanie_token', currentToken);
      showStatus('verify-status', true, 'Аккаунт подтверждён!');
      setTimeout(() => enterApp(), 600);
    } catch (e) { showStatus('verify-status', false, e.message); }
    $('verify-btn').disabled = false;
  }

  async function login() {
    const email = $('login-email').value.trim();
    const password = $('login-password').value;
    if (!email || !password) { showStatus('login-status', false, 'Заполните все поля'); return; }
    $('login-btn').disabled = true;
    try {
      const data = await apiCall('/login', { email, password });
      currentToken = data.token;
      localStorage.setItem('siyanie_token', currentToken);
      showStatus('login-status', true, 'Вход выполнен!');
      setTimeout(() => enterApp(), 600);
    } catch (e) { showStatus('login-status', false, e.message); }
    $('login-btn').disabled = false;
  }

  async function logout() {
    localStorage.removeItem('siyanie_token');
    currentToken = null; currentUser = null; currentChatId = null;
    if (pollInterval) clearInterval(pollInterval);
    $('auth-screen').style.display = 'flex';
    $('app-screen').style.display = 'none';
    $('auth-forms').style.display = 'block';
    $('dashboard').style.display = 'none';
  }

  // ===== APP =====
  async function enterApp() {
    $('auth-screen').style.display = 'none';
    $('app-screen').style.display = 'block';
    try {
      const me = await apiCall('/me');
      currentUser = me;
      $('db-name').textContent = me.display_name || me.name || 'Пользователь';
      $('db-username').textContent = me.username ? '@' + me.username : '';
      $('db-email').textContent = me.email || '';
    } catch (e) {
      if (e.message.includes('401') || e.message.includes('403')) { logout(); return; }
    }
    loadChats();
  }

  async function loadChats() {
    try {
      const data = await apiCall('/chats');
      chatsCache = Array.isArray(data) ? data : (data.chats || []);
      renderChatList($('searchInput').value);
      if (chatsCache.length > 0 && !currentChatId) openChat(chatsCache[0].id);
    } catch (e) { console.error('loadChats', e); }
  }

  function renderChatList(filter = '') {
    const list = $('chatList');
    list.innerHTML = '';
    const term = filter.toLowerCase();
    chatsCache.filter(c => {
      const name = getDisplayName(c).toLowerCase();
      const uname = (c.username || c.participant_username || '').toLowerCase();
      const email = (c.participant_email || '').toLowerCase();
      return name.includes(term) || uname.includes(term) || email.includes(term);
    }).forEach(chat => {
      const lastMsg = chat.last_message || {};
      const isOwn = lastMsg.sender_email === (currentUser && currentUser.email);
      const div = document.createElement('div');
      div.className = 'chat-item ' + (chat.id === currentChatId ? 'active' : '');
      div.onclick = () => openChat(chat.id);
      const name = getDisplayName(chat);
      const initials = getInitials(name);
      div.innerHTML = `
        <div class="chat-avatar">${initials}</div>
        <div class="chat-info">
          <div class="chat-top">
            <div class="chat-name">${name}</div>
            <div class="chat-time">${lastMsg.created_at ? formatTime(lastMsg.created_at) : ''}</div>
          </div>
          <div class="chat-bottom">
            <div class="chat-preview">${lastMsg.text ? (isOwn ? 'Вы: ' : '') + lastMsg.text : 'Нет сообщений'}</div>
            ${chat.unread_count ? `<div class="chat-badge">${chat.unread_count}</div>` : ''}
          </div>
        </div>
      `;
      list.appendChild(div);
    });
  }

  async function openChat(id) {
    currentChatId = id;
    const chat = chatsCache.find(c => c.id === id);
    renderChatList($('searchInput').value);
    if (!chat) return;
    $('chatHeader').style.display = 'flex';
    $('inputArea').style.display = 'flex';
    const name = getDisplayName(chat);
    const username = getUsername(chat);
    $('headerName').textContent = name;
    $('headerAvatar').textContent = getInitials(name);
    $('headerStatus').textContent = username || 'онлайн';
    await loadMessages(id);
    startPolling(id);
  }

  async function loadMessages(chatId) {
    try {
      const data = await apiCall('/chats/' + chatId + '/messages');
      const msgs = Array.isArray(data) ? data : (data.messages || []);
      renderMessages(msgs);
    } catch (e) { console.error('loadMessages', e); }
  }

  function renderMessages(msgs) {
    const area = $('messagesArea');
    if (!msgs || !msgs.length) {
      area.innerHTML = '<div class="empty-chat"><div class="empty-chat-icon">💬</div><div class="empty-chat-text">Напишите первое сообщение</div></div>';
      return;
    }
    area.innerHTML = '';
    let lastDate = null;
    let lastOwn = null;
    let group = null;
    msgs.forEach(msg => {
      const msgDate = msg.created_at ? new Date(msg.created_at).toLocaleDateString('ru-RU') : null;
      if (msgDate && msgDate !== lastDate) {
        const divider = document.createElement('div');
        divider.className = 'date-divider';
        divider.innerHTML = `<span>${msgDate}</span>`;
        area.appendChild(divider);
        lastDate = msgDate;
        lastOwn = null; group = null;
      }
      const isOwn = msg.sender_email === (currentUser && currentUser.email);
      if (lastOwn !== isOwn) {
        group = document.createElement('div');
        group.className = 'message-group ' + (isOwn ? 'own' : 'other');
        area.appendChild(group);
        lastOwn = isOwn;
      }
      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      const time = msg.created_at ? formatTime(msg.created_at) : '';
      const checks = isOwn ? `<span class="checkmarks">${msg.read ? '✓✓' : '✓'}</span>` : '';
      bubble.innerHTML = `${escapeHtml(msg.text)}<div class="message-meta">${time} ${checks}</div>`;
      group.appendChild(bubble);
    });
    area.scrollTop = area.scrollHeight;
  }

  function formatTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  async function sendMessage() {
    const input = $('msgInput');
    const text = input.value.trim();
    if (!text || !currentChatId) return;
    input.value = ''; input.style.height = 'auto';
    try {
      await apiCall('/chats/' + currentChatId + '/messages', { text });
      await loadMessages(currentChatId);
      await loadChats();
    } catch (e) { console.error('sendMessage', e); }
  }

  async function createNewChat() {
    const raw = $('newChatEmail').value.trim();
    if (!raw) return;
    // Можно ввести email или @username
    const isUsername = raw.startsWith('@');
    const payload = isUsername ? { username: raw.slice(1) } : { participant_email: raw };
    $('startChatBtn').disabled = true;
    try {
      const data = await apiCall('/chats', payload);
      $('newChatEmail').value = '';
      $('newChatRow').style.display = 'none';
      await loadChats();
      openChat(data.chat_id || data.id);
    } catch (e) {
      alert(e.message || 'Не удалось создать чат');
    }
    $('startChatBtn').disabled = false;
  }

  function startPolling(chatId) {
    if (pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(async () => {
      if (!currentChatId || currentChatId !== chatId) { clearInterval(pollInterval); return; }
      try {
        const data = await apiCall('/chats/' + chatId + '/messages');
        const msgs = Array.isArray(data) ? data : (data.messages || []);
        renderMessages(msgs);
      } catch (e) { /* ignore polling errors */ }
    }, 3000);
  }

  // ===== EVENTS =====
  document.querySelectorAll('.auth-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      document.querySelectorAll('.auth-view').forEach(v => v.classList.remove('active'));
      $('view-' + tab.dataset.tab).classList.add('active');
    });
  });

  $('register-btn').onclick = register;
  $('verify-btn').onclick = verify;
  $('login-btn').onclick = login;
  $('logout-btn').onclick = logout;
  $('sendBtn').onclick = sendMessage;

  $('newChatToggle').onclick = () => {
    $('newChatRow').style.display = $('newChatRow').style.display === 'none' ? 'flex' : 'none';
    if ($('newChatRow').style.display === 'flex') $('newChatEmail').focus();
  };
  $('startChatBtn').onclick = createNewChat;
  $('newChatEmail').addEventListener('keydown', e => { if (e.key === 'Enter') createNewChat(); });

  $('msgInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  $('msgInput').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });
  $('searchInput').addEventListener('input', e => renderChatList(e.target.value));

  // ===== INIT =====
  if (currentToken) {
    enterApp();
  } else {
    $('auth-screen').style.display = 'flex';
    $('app-screen').style.display = 'none';
  }
</script>

</body>
</html>
