<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Сияние — Чат</title>
<style>
  :root {
    --bg: #0f0f0f;
    --sidebar: #212121;
    --sidebar-hover: #2b2b2b;
    --border: #181818;
    --bubble-own: #8774e1;
    --bubble-other: #212121;
    --text: #ffffff;
    --text-muted: #aaaaaa;
    --text-secondary: #777777;
    --accent: #8774e1;
    --accent-light: #a497f0;
    --danger: #ff6b81;
    --success: #4ade80;
    --input-bg: #2b2b2b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; -webkit-tap-highlight-color: transparent; }

  /* AUTH */
  #auth-screen { display: flex; align-items: center; justify-content: center; height: 100vh; background: var(--bg); padding: 16px; }
  .auth-box { width: 100%; max-width: 380px; background: var(--sidebar); border: 1px solid var(--border); border-radius: 16px; padding: 32px; }
  .auth-logo { text-align: center; margin-bottom: 24px; font-size: 28px; font-weight: 800; background: linear-gradient(120deg, var(--accent), #4fd8ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .auth-tabs { display: flex; gap: 4px; background: var(--bg); border-radius: 10px; padding: 4px; margin-bottom: 20px; }
  .auth-tab { flex: 1; text-align: center; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; background: transparent; color: var(--text-muted); font-family: inherit; transition: all 0.2s; }
  .auth-tab.active { background: linear-gradient(120deg, var(--accent), #4fd8ff); color: #07060c; }
  .auth-view { display: none; }
  .auth-view.active { display: block; }
  label { display: block; font-size: 12.5px; color: var(--text-muted); margin: 0 0 6px; }
  input[type="email"], input[type="password"], input[type="text"] { width: 100%; font-family: inherit; font-size: 15px; color: var(--text); background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; outline: none; margin-bottom: 14px; transition: border-color 0.2s; }
  input:focus { border-color: var(--accent); }
  .submit-btn { width: 100%; font-family: inherit; font-size: 15px; font-weight: 700; padding: 13px; border-radius: 10px; border: none; cursor: pointer; background: linear-gradient(120deg, var(--accent), #4fd8ff); color: #07060c; transition: opacity 0.2s, transform 0.1s; }
  .submit-btn:active { transform: scale(0.98); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .status-msg { font-size: 13.5px; padding: 10px 12px; border-radius: 8px; margin: -4px 0 14px; display: none; }
  .status-msg.show { display: block; }
  .status-msg.err { background: rgba(255,107,129,0.12); color: var(--danger); border: 1px solid rgba(255,107,129,0.3); }
  .status-msg.ok { background: rgba(74,222,128,0.12); color: var(--success); border: 1px solid rgba(74,222,128,0.3); }
  .verify-box { border-top: 1px dashed var(--border); margin-top: 16px; padding-top: 16px; display: none; }
  .verify-box p { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }

  /* APP */
  #app-screen { display: none; height: 100vh; }
  .app-layout { display: flex; height: 100%; position: relative; }

  /* Sidebar */
  .sidebar { width: 360px; min-width: 360px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
  .sidebar-header { padding: 10px 14px; background: var(--sidebar); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .sidebar-search { flex: 1; background: var(--input-bg); border: none; border-radius: 20px; padding: 9px 16px; color: var(--text); font-size: 14px; outline: none; font-family: inherit; }
  .sidebar-search::placeholder { color: var(--text-secondary); }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; }
  .icon-btn:hover { background: var(--sidebar-hover); color: var(--text); }
  .icon-btn:active { transform: scale(0.92); }
  .new-chat-row { display: flex; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); animation: slideDown 0.2s ease; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  .chat-list { flex: 1; overflow-y: auto; }
  .chat-item { display: flex; align-items: center; padding: 10px 16px; cursor: pointer; gap: 12px; transition: background 0.15s; position: relative; }
  .chat-item:hover, .chat-item.active { background: var(--sidebar-hover); }
  .chat-avatar { width: 50px; height: 50px; border-radius: 50%; flex-shrink: 0; background: linear-gradient(135deg, var(--accent), #4fd8ff); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: #fff; }
  .chat-info { flex: 1; min-width: 0; }
  .chat-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .chat-name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-time { font-size: 12px; color: var(--text-secondary); flex-shrink: 0; }
  .chat-bottom { display: flex; justify-content: space-between; align-items: center; }
  .chat-preview { font-size: 14px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .chat-badge { background: var(--accent); color: #fff; font-size: 12px; font-weight: 600; padding: 2px 7px; border-radius: 10px; margin-left: 8px; flex-shrink: 0; }
  .chat-item.active .chat-preview { color: var(--text); }
  .empty-chat-list { text-align: center; padding: 40px 20px; color: var(--text-secondary); font-size: 14px; }

  /* Chat Area */
  .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg); transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
  .chat-header { padding: 10px 20px; background: var(--sidebar); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
  .chat-header-avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #4fd8ff); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #fff; flex-shrink: 0; }
  .chat-header-info { flex: 1; min-width: 0; }
  .chat-header-name { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-header-status { font-size: 13px; color: var(--accent-light); }
  .header-btn { width: 40px; height: 40px; border-radius: 50%; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .header-btn:hover { background: var(--sidebar-hover); }
  .header-btn:active { transform: scale(0.92); }
  .back-btn { display: none; }

  .messages { flex: 1; overflow-y: auto; padding: 16px 10%; display: flex; flex-direction: column; gap: 2px; scroll-behavior: smooth; }
  .date-divider { text-align: center; margin: 16px 0; position: sticky; top: 8px; z-index: 5; }
  .date-divider span { background: rgba(33,33,33,0.95); backdrop-filter: blur(8px); color: var(--text-secondary); font-size: 12px; padding: 4px 12px; border-radius: 12px; border: 1px solid var(--border); }
  .message-group { display: flex; flex-direction: column; gap: 2px; max-width: 70%; animation: msgIn 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
  @keyframes msgIn { from { opacity: 0; transform: translateY(12px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .message-group.own { align-self: flex-end; }
  .message-group.other { align-self: flex-start; }
  .message-bubble { padding: 8px 12px; font-size: 14.5px; line-height: 1.45; position: relative; word-wrap: break-word; }
  .message-group.own .message-bubble { background: var(--bubble-own); color: #fff; border-radius: 16px 16px 4px 16px; }
  .message-group.other .message-bubble { background: var(--bubble-other); color: var(--text); border-radius: 16px 16px 16px 4px; }
  .message-group.own .message-bubble:first-child { border-top-right-radius: 16px; }
  .message-group.own .message-bubble:last-child { border-bottom-right-radius: 4px; }
  .message-group.own .message-bubble:only-child { border-radius: 16px 16px 4px 16px; }
  .message-group.other .message-bubble:first-child { border-top-left-radius: 16px; }
  .message-group.other .message-bubble:last-child { border-bottom-left-radius: 4px; }
  .message-group.other .message-bubble:only-child { border-radius: 16px 16px 16px 4px; }
  .message-bubble:not(:first-child) { margin-top: 1px; }
  .message-bubble a { color: inherit; text-decoration: underline; text-underline-offset: 2px; opacity: 0.85; }
  .message-bubble a:hover { opacity: 1; }
  .message-meta { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 3px; font-size: 11px; }
  .message-group.own .message-meta { color: rgba(255,255,255,0.7); }
  .message-group.other .message-meta { color: var(--text-secondary); }
  .checkmarks { font-size: 13px; letter-spacing: -2px; }

  .input-area { padding: 10px 10%; background: var(--sidebar); border-top: 1px solid var(--border); display: flex; align-items: flex-end; gap: 10px; }
  .input-btn { width: 44px; height: 44px; border-radius: 50%; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; }
  .input-btn:hover { background: var(--sidebar-hover); color: var(--text); }
  .input-btn:active { transform: scale(0.9); }
  .input-btn.send { color: var(--accent); }
  .input-btn.send:hover { color: var(--accent-light); background: rgba(135,116,225,0.1); }
  .message-input { flex: 1; background: var(--input-bg); border: none; border-radius: 20px; padding: 10px 16px; color: var(--text); font-size: 15px; outline: none; resize: none; max-height: 120px; font-family: inherit; line-height: 1.4; }
  .message-input::placeholder { color: var(--text-secondary); }

  .empty-chat { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-secondary); }
  .empty-chat-icon { font-size: 72px; margin-bottom: 16px; opacity: 0.2; filter: grayscale(1); }
  .empty-chat-text { font-size: 15px; }

  .typing-indicator { font-size: 13px; color: var(--accent-light); padding: 4px 20px; height: 22px; }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #555; }

  /* Tablet */
  @media (max-width: 960px) {
    .sidebar { width: 80px; min-width: 80px; }
    .chat-info, .chat-time, .chat-bottom, .sidebar-search, .new-chat-row { display: none; }
    .chat-avatar { width: 48px; height: 48px; font-size: 16px; }
    .messages, .input-area { padding: 12px; }
    .chat-item { justify-content: center; padding: 10px; }
  }

  /* Mobile */
  @media (max-width: 600px) {
    .app-layout { overflow: hidden; }
    .sidebar { 
      width: 100%; 
      min-width: 100%; 
      position: absolute; 
      left: 0; 
      top: 0; 
      height: 100%; 
      z-index: 10;
      border-right: none;
    }
    .chat-area { 
      position: absolute; 
      left: 0; 
      top: 0; 
      width: 100%; 
      height: 100%; 
      z-index: 20;
      transform: translateX(100%);
      background: var(--bg);
    }
    .chat-area.chat-open-mobile { transform: translateX(0); }
    .back-btn { display: flex !important; }
    .messages, .input-area { padding: 10px; }
    .chat-header { padding: 10px 12px; }
    .sidebar-header { padding: 10px 12px; }
    .auth-box { padding: 24px 20px; border-radius: 12px; }
  }
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">✦ СИЯНИЕ</div>
    <div id="auth-forms">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="register">Регистрация</button>
        <button class="auth-tab" data-tab="login">Вход</button>
      </div>
      <div class="auth-view active" id="view-register">
        <div class="status-msg" id="register-status"></div>
        <label>Ваше имя</label>
        <input id="reg-name" type="text" placeholder="Иван Петров" autocomplete="off">
        <label>Ник</label>
        <input id="reg-username" type="text" placeholder="ivan_petrov" autocomplete="off">
        <label>Email</label>
        <input id="reg-email" type="email" placeholder="name@example.com" autocomplete="off">
        <label>Пароль</label>
        <input id="reg-password" type="password" placeholder="Минимум 6 символов" autocomplete="off">
        <button class="submit-btn" id="register-btn">Создать аккаунт</button>
        <div class="verify-box" id="verify-box">
          <p>На ваш email отправлен код подтверждения. Введите его ниже:</p>
          <label>Код</label>
          <input id="verify-code" type="text" maxlength="6" placeholder="123456">
          <button class="submit-btn" id="verify-btn">Подтвердить</button>
          <div class="status-msg" id="verify-status"></div>
        </div>
      </div>
      <div class="auth-view" id="view-login">
        <div class="status-msg" id="login-status"></div>
        <label>Email</label>
        <input id="login-email" type="email" placeholder="name@example.com" autocomplete="off">
        <label>Пароль</label>
        <input id="login-password" type="password" placeholder="Ваш пароль" autocomplete="off">
        <button class="submit-btn" id="login-btn">Войти</button>
      </div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app-screen">
  <div class="app-layout">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="icon-btn" id="menuBtn" title="Меню">☰</button>
        <input type="text" class="sidebar-search" id="searchInput" placeholder="Поиск по чатам">
        <button class="icon-btn" id="newChatToggle" title="Новый чат">+</button>
        <button class="icon-btn" id="logoutBtn" title="Выйти">🚪</button>
      </div>
      <div class="new-chat-row" id="newChatRow" style="display:none;">
        <input id="newChatEmail" type="text" placeholder="Email или @ник собеседника">
        <button class="submit-btn" id="startChatBtn" style="width:auto;padding:10px 16px;">→</button>
      </div>
      <div class="chat-list" id="chatList"></div>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="chat-header" id="chatHeader" style="display:none;">
        <button class="header-btn back-btn" id="backBtn" title="Назад">←</button>
        <div class="chat-header-avatar" id="headerAvatar">?</div>
        <div class="chat-header-info">
          <div class="chat-header-name" id="headerName">—</div>
          <div class="chat-header-status" id="headerStatus">—</div>
        </div>
        <div style="flex:1"></div>
        <button class="header-btn" id="moreBtn" title="Ещё">⋮</button>
      </div>

      <div class="messages" id="messagesArea">
        <div class="empty-chat">
          <div class="empty-chat-icon">💬</div>
          <div class="empty-chat-text">Выберите чат, чтобы начать общение</div>
        </div>
      </div>

      <div class="input-area" id="inputArea" style="display:none;">
        <button class="input-btn" id="emojiBtn" title="Эмодзи">😊</button>
        <button class="input-btn" id="attachBtn" title="Прикрепить файл">📎</button>
        <textarea class="message-input" id="msgInput" placeholder="Написать сообщение..." rows="1"></textarea>
        <button class="input-btn send" id="sendBtn" title="Отправить">➤</button>
      </div>
    </div>
  </div>
</div>

<script>
  const API_BASE = "https://calm-blessing-production-5141.up.railway.app";
  let currentToken = localStorage.getItem('siyanie_token') || null;
  let currentUser = null;
  let currentChatId = null;
  let chatsCache = [];
  let pollInterval = null;
  let chatListPollInterval = null;
  let lastMessageSignatures = new Map();
  let isUserAtBottom = true;

  const $ = id => document.getElementById(id);

  function showStatus(id, ok, text) {
    const el = $(id);
    if (!el) return;
    el.className = 'status-msg show ' + (ok ? 'ok' : 'err');
    el.textContent = text;
  }

  async function apiCall(path, body, token) {
    const opts = { method: body ? 'POST' : 'GET', headers: {} };
    if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    if (token || currentToken) opts.headers['Authorization'] = 'Bearer ' + (token || currentToken);
    const res = await fetch(API_BASE + path, opts);
    const text = await res.text();
    let data = {};
    try { data = JSON.parse(text); } catch(e) {}
    if (!res.ok) throw new Error(data.detail || data.message || data.error || text || ('Ошибка ' + res.status));
    return data;
  }

  function safe(obj, path, fallback) {
    return path.split('.').reduce((o,k) => (o && o[k] !== undefined) ? o[k] : undefined, obj) ?? fallback;
  }

  function getDisplayName(chatOrUser) {
    if (!chatOrUser) return 'Пользователь';
    if (chatOrUser.display_name) return chatOrUser.display_name;
    if (chatOrUser.name) return chatOrUser.name;
    if (chatOrUser.username) return '@' + chatOrUser.username;
    const p = chatOrUser.participant;
    if (p) {
      if (p.display_name) return p.display_name;
      if (p.name) return p.name;
      if (p.username) return '@' + p.username;
      if (p.email) return p.email.split('@')[0];
    }
    if (chatOrUser.participant_email) return chatOrUser.participant_email.split('@')[0];
    if (chatOrUser.email) return chatOrUser.email.split('@')[0];
    return 'Пользователь';
  }

  function getUsername(chatOrUser) {
    if (!chatOrUser) return '';
    if (chatOrUser.username) return '@' + chatOrUser.username;
    const p = chatOrUser.participant;
    if (p && p.username) return '@' + p.username;
    return '';
  }

  function getInitials(str) {
    if (!str) return '?';
    const clean = str.replace(/^@/, '');
    return clean.split(/[\s._-]+/).filter(Boolean).map(w => w[0].toUpperCase()).slice(0,2).join('');
  }

  function formatTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  }

  function formatDateDivider(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    const today = new Date();
    const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
    if (d.toDateString() === today.toDateString()) return 'Сегодня';
    if (d.toDateString() === yesterday.toDateString()) return 'Вчера';
    return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
  }

  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function linkify(text) {
    const urlRegex = /(https?:\/\/[^\s<]+[^\s<.,!?;:'"])/g;
    return text.replace(urlRegex, url => `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);
  }

  async function register() {
    const display_name = $('reg-name').value.trim();
    const username = $('reg-username').value.trim().replace(/^@/, '');
    const email = $('reg-email').value.trim();
    const password = $('reg-password').value;
    if (!display_name) { showStatus('register-status', false, 'Введите ваше имя'); return; }
    if (!username) { showStatus('register-status', false, 'Придумайте ник'); return; }
    if (!email || password.length < 6) { showStatus('register-status', false, 'Введите email и пароль (мин. 6 символов)'); return; }
    $('register-btn').disabled = true;
    try {
      await apiCall('/register', { email, password, display_name, username });
      showStatus('register-status', true, 'Код отправлен на email');
      $('verify-box').style.display = 'block';
    } catch (e) { showStatus('register-status', false, e.message); }
    $('register-btn').disabled = false;
  }

  async function verify() {
    const email = $('reg-email').value.trim();
    const code = $('verify-code').value.trim();
    if (!code) { showStatus('verify-status', false, 'Введите код'); return; }
    $('verify-btn').disabled = true;
    try {
      const data = await apiCall('/verify', { email, code });
      currentToken = data.token;
      localStorage.setItem('siyanie_token', currentToken);
      showStatus('verify-status', true, 'Аккаунт подтверждён!');
      setTimeout(() => enterApp(), 600);
    } catch (e) { showStatus('verify-status', false, e.message); }
    $('verify-btn').disabled = false;
  }

  async function login() {
    const email = $('login-email').value.trim();
    const password = $('login-password').value;
    if (!email || !password) { showStatus('login-status', false, 'Заполните все поля'); return; }
    $('login-btn').disabled = true;
    try {
      const data = await apiCall('/login', { email, password });
      currentToken = data.token;
      localStorage.setItem('siyanie_token', currentToken);
      showStatus('login-status', true, 'Вход выполнен!');
      setTimeout(() => enterApp(), 600);
    } catch (e) { showStatus('login-status', false, e.message); }
    $('login-btn').disabled = false;
  }

  async function logout() {
    localStorage.removeItem('siyanie_token');
    currentToken = null; currentUser = null; currentChatId = null;
    if (pollInterval) clearInterval(pollInterval);
    if (chatListPollInterval) clearInterval(chatListPollInterval);
    lastMessageSignatures.clear();
    $('auth-screen').style.display = 'flex';
    $('app-screen').style.display = 'none';
    $('chatArea').classList.remove('chat-open-mobile');
  }

  async function enterApp() {
    $('auth-screen').style.display = 'none';
    $('app-screen').style.display = 'block';
    try {
      const me = await apiCall('/me');
      currentUser = me;
    } catch (e) {
      console.error('/me error:', e);
      if (e.message.includes('401') || e.message.includes('403') || e.message.includes('404') || e.message.includes('не авторизован')) {
        logout(); return;
      }
    }
    await loadChats();
    if (chatsCache.length > 0 && !currentChatId) {
      openChat(chatsCache[0].id);
    }
    startChatListPolling();
  }

  async function loadChats() {
    try {
      const data = await apiCall('/chats');
      chatsCache = Array.isArray(data) ? data : (data.chats || []);
      renderChatList($('searchInput').value);
    } catch (e) { console.error('loadChats error:', e); }
  }

  function renderChatList(filter) {
    const list = $('chatList');
    const term = (filter || '').toLowerCase();
    const filtered = chatsCache.filter(c => {
      const name = getDisplayName(c).toLowerCase();
      const uname = (c.username || safe(c, 'participant.username', '')).toLowerCase();
      const email = (c.participant_email || safe(c, 'participant.email', '') || '').toLowerCase();
      return name.includes(term) || uname.includes(term) || email.includes(term);
    });

    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty-chat-list">Нет чатов. Нажмите + чтобы создать.</div>';
      return;
    }

    const newHtml = filtered.map(chat => {
      const lastMsg = chat.last_message || {};
      const isOwn = lastMsg.sender_email === safe(currentUser, 'email', '');
      const name = escapeHtml(getDisplayName(chat));
      const initials = getInitials(name);
      const activeClass = chat.id === currentChatId ? 'active' : '';
      return `
        <div class="chat-item ${activeClass}" data-chat-id="${chat.id}">
          <div class="chat-avatar">${initials}</div>
          <div class="chat-info">
            <div class="chat-top">
              <div class="chat-name">${name}</div>
              <div class="chat-time">${lastMsg.created_at ? formatTime(lastMsg.created_at) : ''}</div>
            </div>
            <div class="chat-bottom">
              <div class="chat-preview">${lastMsg.text ? (isOwn ? 'Вы: ' : '') + escapeHtml(lastMsg.text) : 'Нет сообщений'}</div>
              ${chat.unread_count ? `<div class="chat-badge">${chat.unread_count}</div>` : ''}
            </div>
          </div>
        </div>
      `;
    }).join('');

    if (list.innerHTML !== newHtml) {
      list.innerHTML = newHtml;
      list.querySelectorAll('.chat-item').forEach(item => {
        item.onclick = () => openChat(parseInt(item.dataset.chatId));
      });
    }
  }

  async function openChat(id) {
    currentChatId = id;
    const chat = chatsCache.find(c => c.id === id);
    renderChatList($('searchInput').value);
    if (!chat) { console.warn('chat not found:', id); return; }

    $('chatHeader').style.display = 'flex';
    $('inputArea').style.display = 'flex';
    const name = getDisplayName(chat);
    const username = getUsername(chat);
    $('headerName').textContent = name;
    $('headerAvatar').textContent = getInitials(name);
    $('headerStatus').textContent = username || 'онлайн';

    if (window.innerWidth <= 600) {
      $('chatArea').classList.add('chat-open-mobile');
    }

    await loadMessages(id);
    startPolling(id);
  }

  async function loadMessages(chatId) {
    try {
      const data = await apiCall('/chats/' + chatId + '/messages');
      const msgs = Array.isArray(data) ? data : (data.messages || []);
      renderMessages(msgs);
    } catch (e) { console.error('loadMessages error:', e); }
  }

  function renderMessages(msgs) {
    const area = $('messagesArea');
    if (!msgs || !msgs.length) {
      area.innerHTML = '<div class="empty-chat"><div class="empty-chat-icon">💬</div><div class="empty-chat-text">Напишите первое сообщение</div></div>';
      lastMessageSignatures.set(currentChatId, '');
      return;
    }

    const wasAtBottom = isUserAtBottom;
    const oldScrollHeight = area.scrollHeight;
    const oldScrollTop = area.scrollTop;

    area.innerHTML = '';
    let lastDate = null;
    let lastOwn = null;
    let group = null;
    const myEmail = safe(currentUser, 'email', '');

    msgs.forEach(msg => {
      const msgDate = msg.created_at ? new Date(msg.created_at).toDateString() : null;
      if (msgDate && msgDate !== lastDate) {
        const divider = document.createElement('div');
        divider.className = 'date-divider';
        divider.innerHTML = `<span>${formatDateDivider(msg.created_at)}</span>`;
        area.appendChild(divider);
        lastDate = msgDate;
        lastOwn = null; group = null;
      }
      const isOwn = msg.sender_email === myEmail;
      if (lastOwn !== isOwn) {
        group = document.createElement('div');
        group.className = 'message-group ' + (isOwn ? 'own' : 'other');
        area.appendChild(group);
        lastOwn = isOwn;
      }
      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      const time = msg.created_at ? formatTime(msg.created_at) : '';
      const checks = isOwn ? `<span class="checkmarks">${msg.read ? '✓✓' : '✓'}</span>` : '';
      const textWithLinks = linkify(escapeHtml(msg.text));
      bubble.innerHTML = `${textWithLinks}<div class="message-meta">${time} ${checks}</div>`;
      group.appendChild(bubble);
    });

    if (wasAtBottom) {
      area.scrollTop = area.scrollHeight;
    } else {
      const newScrollHeight = area.scrollHeight;
      area.scrollTop = oldScrollTop + (newScrollHeight - oldScrollHeight);
    }

    const sig = msgs.map(m => m.id + ':' + (m.read ? '1' : '0') + ':' + m.text).join('|');
    lastMessageSignatures.set(currentChatId, sig);
  }

  async function sendMessage() {
    const input = $('msgInput');
    const text = input.value.trim();
    if (!text || !currentChatId) return;
    input.value = ''; input.style.height = 'auto';
    isUserAtBottom = true;
    try {
      await apiCall('/chats/' + currentChatId + '/messages', { text });
      await loadMessages(currentChatId);
      await loadChats();
    } catch (e) { console.error('sendMessage error:', e); alert('Ошибка отправки: ' + e.message); }
  }

  async function createNewChat() {
    const raw = $('newChatEmail').value.trim();
    if (!raw) return;
    const isUsername = raw.startsWith('@');
    const payload = isUsername ? { username: raw.slice(1) } : { participant_email: raw };
    $('startChatBtn').disabled = true;
    try {
      const data = await apiCall('/chats', payload);
      $('newChatEmail').value = '';
      $('newChatRow').style.display = 'none';
      await loadChats();
      const newId = data.chat_id || data.id;
      if (newId) openChat(newId);
    } catch (e) {
      console.error('createNewChat error:', e);
      alert(e.message || 'Не удалось создать чат');
    }
    $('startChatBtn').disabled = false;
  }

  function startPolling(chatId) {
    if (pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(async () => {
      if (!currentChatId || currentChatId !== chatId) { clearInterval(pollInterval); return; }
      try {
        const data = await apiCall('/chats/' + chatId + '/messages');
        const msgs = Array.isArray(data) ? data : (data.messages || []);
        const sig = msgs.map(m => m.id + ':' + (m.read ? '1' : '0') + ':' + m.text).join('|');
        if (lastMessageSignatures.get(chatId) !== sig) {
          renderMessages(msgs);
        }
      } catch (e) { /* ignore */ }
    }, 3000);
  }

  function startChatListPolling() {
    if (chatListPollInterval) clearInterval(chatListPollInterval);
    chatListPollInterval = setInterval(() => {
      if (!currentToken) return;
      loadChats();
    }, 5000);
  }

  document.querySelectorAll('.auth-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      document.querySelectorAll('.auth-view').forEach(v => v.classList.remove('active'));
      const view = $('view-' + tab.dataset.tab);
      if (view) view.classList.add('active');
    });
  });

  $('register-btn').onclick = register;
  $('verify-btn').onclick = verify;
  $('login-btn').onclick = login;
  $('logoutBtn').onclick = logout;
  $('sendBtn').onclick = sendMessage;
  $('backBtn').onclick = () => {
    $('chatArea').classList.remove('chat-open-mobile');
    currentChatId = null;
    renderChatList($('searchInput').value);
    if (pollInterval) clearInterval(pollInterval);
    $('chatHeader').style.display = 'none';
    $('inputArea').style.display = 'none';
    $('messagesArea').innerHTML = `
      <div class="empty-chat">
        <div class="empty-chat-icon">💬</div>
        <div class="empty-chat-text">Выберите чат, чтобы начать общение</div>
      </div>
    `;
  };

  $('newChatToggle').onclick = () => {
    const row = $('newChatRow');
    row.style.display = row.style.display === 'none' ? 'flex' : 'none';
    if (row.style.display === 'flex') $('newChatEmail').focus();
  };
  $('startChatBtn').onclick = createNewChat;
  $('newChatEmail').addEventListener('keydown', e => { if (e.key === 'Enter') createNewChat(); });

  $('msgInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  $('msgInput').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });
  $('searchInput').addEventListener('input', e => renderChatList(e.target.value));

  $('messagesArea').addEventListener('scroll', function() {
    isUserAtBottom = this.scrollHeight - this.scrollTop - this.clientHeight < 80;
  });

  window.addEventListener('resize', () => {
    if (window.innerWidth > 600) {
      $('chatArea').classList.remove('chat-open-mobile');
    } else if (currentChatId) {
      $('chatArea').classList.add('chat-open-mobile');
    }
  });

  if (currentToken) {
    enterApp();
  } else {
    $('auth-screen').style.display = 'flex';
    $('app-screen').style.display = 'none';
  }
</script>

</body>
</html>
